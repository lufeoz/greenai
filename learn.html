<script>window.LAB = {"items": [{"t": "생성형 AI, 처음 시작하기", "d": "AI 비서 하나를 골라, 오늘 업무 하나를 실제로 맡겨 보는 첫 실습이에요.", "cat": "basic", "level": "초급", "what": "AI를 '공부'부터 하려고 하면 금방 지쳐요. 가장 빠른 방법은 오늘 해야 하는 일 하나를 AI에게 맡겨 보고, 결과를 고쳐 쓰는 경험을 한 번 해 보는 거예요. 이 레슨이 끝나면 AI 비서 하나에 가입해 있고, 실제 업무 결과물 하나를 손에 쥐고 있게 돼요.", "how": ["AI 비서 하나 고르기", "오늘 할 일 중 '글로 된 일' 고르기", "상황을 넣어 요청하기", "한 번 더 다듬기", "내 말로 마무리하기"], "rel": [["AI 도구 디렉터리", "/directory"]], "alias": "basic", "url": "/lessons/ai-first-steps", "urlLabel": "레슨 읽기 · 약 15분", "full": 1, "price": "📖 상세 레슨"}, {"t": "AI 답을 믿어도 될까: 확인 습관", "d": "AI가 그럴듯하게 틀리는 이유를 알고, 결과를 확인하는 3가지 습관을 만들어요.", "cat": "basic", "level": "초급", "what": "AI는 '가장 그럴듯한 다음 말'을 만들어 내는 방식이라, 모르는 것도 자신 있게 말할 때가 있어요. 이걸 환각(hallucination)이라고 불러요. 업무에 AI를 쓰면서 신뢰를 잃는 가장 흔한 이유가 이 확인을 건너뛰는 거예요.", "how": ["위험한 정보 구분하기", "확실하지 않은 부분을 표시하게 하기", "출처를 달라고 하고 직접 열어 보기", "원문과 대조하기", "두 번째 의견 받기"], "rel": [["목적별 AI 툴 가이드", "/guides/ai-tools"]], "alias": "basic", "url": "/lessons/verify-ai-answers", "urlLabel": "레슨 읽기 · 약 12분", "full": 1, "price": "📖 상세 레슨"}, {"t": "좋은 프롬프트의 4요소", "d": "역할·맥락·작업·형식, 네 가지만 넣어도 AI의 답이 확 달라져요.", "cat": "prompt", "level": "초급", "what": "같은 AI에게 같은 일을 시켜도 사람마다 결과가 다른 이유는 요청 문장의 차이예요. 좋은 프롬프트는 길 필요가 없어요. 네 가지 요소가 빠지지 않으면 돼요.", "how": ["작업부터 쓰기", "맥락 더하기", "역할 붙이기", "형식 정하기", "TOOLS LAB으로 연습하기"], "rel": [["프롬프트 생성기", "/tools#prompt"], ["PROMPT LIBRARY", "/prompts"]], "alias": "prompt", "url": "/lessons/prompt-4-elements", "urlLabel": "레슨 읽기 · 약 15분", "full": 1, "price": "📖 상세 레슨"}, {"t": "AI 개인정보·보안 기본", "d": "AI에 넣으면 안 되는 정보와, 안전하게 쓰기 위한 설정을 정리해요.", "cat": "basic", "level": "초급", "what": "AI 대화창은 편하지만, 붙여넣은 내용이 어디에 저장되고 어떻게 쓰이는지 모르고 쓰면 회사와 고객 모두에게 위험할 수 있어요. 몇 가지 규칙만 지키면 대부분의 위험을 피할 수 있어요.", "how": ["넣지 말 것 목록 만들기", "가명으로 바꿔 넣기", "서비스 설정 확인하기", "회사 정책 확인하기", "공유 링크 조심하기"], "rel": [], "alias": "basic", "url": "/lessons/ai-privacy-basics", "urlLabel": "레슨 읽기 · 약 10분", "full": 1, "price": "📖 상세 레슨"}, {"t": "예시를 주는 프롬프트 (퓨샷)", "d": "원하는 결과 예시 2개만 보여줘도 톤과 형식이 안정돼요.
